name: Validation

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-theme:
    name: Theme validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install validation dependency
        run: npm ci --ignore-scripts
      - name: Validate theme, examples, preview and contrast
        run: npm run validate
      - name: Verify generated files are current
        run: |
          npm run preview:build
          git diff --exit-code -- preview/index.html docs/VALIDATION.md

  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate theme repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: theme
          comment: 'false'
