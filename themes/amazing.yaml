  ha-color-fill-warning-loud-resting: "#f4cf81"
  ha-color-fill-warning-loud-hover: "#ffe3a2"
  ha-color-fill-warning-loud-active: "#e8c28a"
  ha-color-on-warning-quiet: "#f4cf81"
  ha-color-on-warning-normal: "#f4cf81"
  ha-color-on-warning-loud: "#111e30"

  ha-color-border-success-quiet: "#9fe5cf"
  ha-color-border-success-normal: "#9fe5cf"
  ha-color-border-success-loud: "#9fe5cf"
