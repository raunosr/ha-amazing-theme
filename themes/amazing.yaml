# Amazing — original navy + mint palette from Amazing Weather Card v0.1.0.
# Install this file under config/themes/amazing/amazing.yaml.
# No card-mod, JavaScript, custom fonts, images or custom cards required.
Amazing:
  # A dark-only theme. Colors at the top level also cover view-level use
  # when the surrounding Home Assistant profile uses a different mode.
  modes:
    dark: {}

  # Main palette. Light primary/accent fills need DARK foreground text.
  primary-color: "#9fe5cf"
  accent-color: "#86c4ff"
  light-primary-color: "#c3f1e3"
  dark-primary-color: "#6bc8ac"
  darker-primary-color: "#429e85"
  primary-text-color: "#eef5fc"
  secondary-text-color: "#b1c3d7"
  text-primary-color: "#111e30"
  text-accent-color: "#111e30"
  text-light-primary-color: "#111e30"
  disabled-text-color: "#7890a8"
  disabled-color: "#526a82"
  primary-background-color: "#0b1523"
  secondary-background-color: "#1d3047"
  card-background-color: "#111e30"
  clear-background-color: "#0b1523"
  lovelace-background: "#0b1523"

  # Keep decorative separators subtle; controls have stronger outlines.
  divider-color: "#2c4057"
  outline-color: "#7890a8"
  outline-hover-color: "#b1c3d7"
  # A fixed-size, subtle highlight stays in the corner on large and small cards.
  # Keep card-background-color solid: dialogs and chart tooltips use it as a color.
  ha-card-background: "radial-gradient(ellipse 280px 210px at 100% 0%, rgba(134, 196, 255, 0.08), transparent 72%), #111e30"
  ha-card-border-color: "#2c4057"
  ha-card-border-width: "1px"
  ha-card-border-radius: "24px"
  ha-card-box-shadow: "none"
  ha-card-header-color: "#eef5fc"

  # Native history/statistics charts assign these by series order, not domain.
  graph-color-1: "#9fe5cf"
  graph-color-2: "#86c4ff"
  graph-color-3: "#f4cf81"
  graph-color-4: "#b5a7e8"
  graph-color-5: "#ff9b9b"
  graph-color-6: "#79d5dc"
  graph-color-7: "#e8b895"
  graph-color-8: "#9caef5"

  # Navigation and application chrome.
  sidebar-background-color: "#0e1a2a"
  sidebar-text-color: "#eef5fc"
  sidebar-icon-color: "#b1c3d7"
  sidebar-selected-text-color: "#9fe5cf"
  sidebar-selected-icon-color: "#9fe5cf"
  app-header-background-color: "#0e1a2a"
  app-header-text-color: "#eef5fc"
  app-header-border-bottom: "1px solid #2c4057"
  app-theme-color: "#0e1a2a"
  scrollbar-thumb-color: "#7890a8"

  # Semantic status colors. Preserve HA's domain-specific alarm/lock rules.
  error-color: "#ff9b9b"
  warning-color: "#f4cf81"
  success-color: "#9fe5cf"
  info-color: "#86c4ff"
  state-icon-color: "#b1c3d7"
  state-icon-unavailable-color: "#7890a8"
  state-light-active-color: "#f4cf81"
  state-switch-active-color: "#9fe5cf"
  state-input_boolean-active-color: "#9fe5cf"

  # Inputs: explicit text and outline colors for older MDC controls.
  input-fill-color: "#1d3047"
  input-disabled-fill-color: "#17263a"
  input-ink-color: "#eef5fc"
  input-label-ink-color: "#b1c3d7"
  input-disabled-ink-color: "#7890a8"
  input-dropdown-icon-color: "#b1c3d7"
  input-idle-line-color: "#7890a8"
  input-hover-line-color: "#b1c3d7"
  input-disabled-line-color: "#2c4057"
  input-outlined-idle-border-color: "#7890a8"
  input-outlined-hover-border-color: "#b1c3d7"
  input-outlined-disabled-border-color: "#2c4057"

  # Sliders, switches and badges. Retain native dimensions and touch targets.
  slider-color: "#9fe5cf"
  slider-secondary-color: "#6bc8ac"
  slider-track-color: "#7890a8"
  ha-slider-thumb-color: "#9fe5cf"
  ha-slider-indicator-color: "#9fe5cf"
  ha-slider-track-color: "#7890a8"
  switch-checked-color: "#9fe5cf"
  switch-unchecked-button-color: "#b1c3d7"
  switch-unchecked-track-color: "#526a82"
  ha-switch-background-color: "#1d3047"
  ha-switch-background-color-hover: "#25435c"
  ha-switch-border-color: "#7890a8"
  ha-switch-thumb-background-color: "#b1c3d7"
  ha-switch-thumb-border-color: "#b1c3d7"
  ha-switch-checked-background-color: "#9fe5cf"
  ha-switch-checked-background-color-hover: "#c3f1e3"
  ha-switch-checked-border-color: "#9fe5cf"
  ha-switch-checked-thumb-background-color: "#111e30"
  ha-switch-checked-thumb-border-color: "#111e30"
  label-badge-background-color: "#1d3047"
  label-badge-text-color: "#eef5fc"
  chip-background-color: "#1d3047"

  # Dialogs and menus. Opaque surfaces avoid contrast changes over content.
  ha-dialog-surface-background: "#111e30"
  ha-dialog-border-radius: "24px"
  mdc-theme-surface: "#111e30"
  mdc-theme-on-surface: "#eef5fc"
  mdc-theme-on-primary: "#111e30"
  mdc-theme-on-secondary: "#111e30"
  mdc-dialog-heading-ink-color: "#eef5fc"
  mdc-dialog-content-ink-color: "#eef5fc"
  mdc-dialog-scrim-color: "rgba(6, 18, 29, 0.8)"
  dialog-box-shadow: "0 20px 70px rgba(0, 0, 0, 0.4)"
  ha-tooltip-background-color: "#1d3047"
  ha-tooltip-text-color: "#eef5fc"
  table-header-background-color: "#1d3047"
  table-row-background-color: "#111e30"
  table-row-alternative-background-color: "#17263a"
  data-table-background-color: "#111e30"
  markdown-code-background-color: "#0b1523"
  code-editor-background-color: "#0b1523"

  # Current HA semantic tokens (Web Awesome-based native components).
  # These are implementation-level hooks; see docs/COMPATIBILITY.md.
  ha-color-focus: "#9fe5cf"
  ha-color-text-primary: "#eef5fc"
  ha-color-text-secondary: "#b1c3d7"
  ha-color-text-disabled: "#7890a8"
  ha-color-text-link: "#9fe5cf"
  ha-color-text-primary-inverted: "#111e30"
  ha-color-text-secondary-inverted: "#2c4057"
  ha-color-surface-default: "#111e30"
  ha-color-surface-low: "#0e1a2a"
  ha-color-surface-lower: "#0b1523"
  ha-color-surface-default-inverted: "#eef5fc"
  ha-color-surface-low-inverted: "#d8e6f3"
  ha-color-surface-lower-inverted: "#b1c3d7"
  ha-color-on-surface-default: "#eef5fc"
  ha-color-form-background: "#1d3047"
  ha-color-form-background-hover: "#25435c"
  ha-color-form-background-disabled: "#17263a"

  ha-color-border-primary-quiet: "#526a82"
  ha-color-border-primary-normal: "#9fe5cf"
  ha-color-border-primary-loud: "#9fe5cf"
  ha-color-fill-primary-quiet-resting: "#142b31"
  ha-color-fill-primary-quiet-hover: "#1d3c40"
  ha-color-fill-primary-quiet-active: "#254b4b"
  ha-color-fill-primary-normal-resting: "#1d3c40"
  ha-color-fill-primary-normal-hover: "#254b4b"
  ha-color-fill-primary-normal-active: "#2b5552"
  ha-color-fill-primary-loud-resting: "#9fe5cf"
  ha-color-fill-primary-loud-hover: "#c3f1e3"
  ha-color-fill-primary-loud-active: "#6bc8ac"
  ha-color-on-primary-quiet: "#9fe5cf"
  ha-color-on-primary-normal: "#9fe5cf"
  ha-color-on-primary-loud: "#111e30"

  ha-color-border-neutral-quiet: "#7890a8"
  ha-color-border-neutral-normal: "#7890a8"
  ha-color-border-neutral-loud: "#b1c3d7"
  ha-color-fill-neutral-quiet-resting: "#111e30"
  ha-color-fill-neutral-quiet-hover: "#1d3047"
  ha-color-fill-neutral-quiet-active: "#25435c"
  ha-color-fill-neutral-normal-resting: "#1d3047"
  ha-color-fill-neutral-normal-hover: "#25435c"
  ha-color-fill-neutral-normal-active: "#2c4057"
  ha-color-fill-neutral-loud-resting: "#b1c3d7"
  ha-color-fill-neutral-loud-hover: "#d8e6f3"
  ha-color-fill-neutral-loud-active: "#91a9c1"
  ha-color-on-neutral-quiet: "#b1c3d7"
  ha-color-on-neutral-normal: "#eef5fc"
  ha-color-on-neutral-loud: "#111e30"

  ha-color-fill-disabled-quiet-resting: "#17263a"
  ha-color-fill-disabled-quiet-hover: "#17263a"
  ha-color-fill-disabled-normal-resting: "#1d3047"
  ha-color-fill-disabled-normal-hover: "#1d3047"
  ha-color-fill-disabled-loud-resting: "#2c4057"
  ha-color-fill-disabled-loud-hover: "#2c4057"
  ha-color-on-disabled-quiet: "#7890a8"
  ha-color-on-disabled-normal: "#7890a8"
  ha-color-on-disabled-loud: "#7890a8"

  # Keep warning/danger meanings, with readable light fills + dark labels.
  ha-color-border-danger-quiet: "#ff9b9b"
  ha-color-border-danger-normal: "#ff9b9b"
  ha-color-border-danger-loud: "#ff9b9b"
  ha-color-fill-danger-quiet-resting: "#301f2b"
  ha-color-fill-danger-quiet-hover: "#422733"
  ha-color-fill-danger-quiet-active: "#54303b"
  ha-color-fill-danger-normal-resting: "#422733"
  ha-color-fill-danger-normal-hover: "#54303b"
  ha-color-fill-danger-normal-active: "#613744"
  ha-color-fill-danger-loud-resting: "#ff9b9b"
  ha-color-fill-danger-loud-hover: "#ffb8b8"
